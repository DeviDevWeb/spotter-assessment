# Full stack: Postgres + Django API + React app served by nginx
# Usage: docker compose up --build  ->  http://localhost:8080

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-truck_routing}
            POSTGRES_USER: ${POSTGRES_USER:-truck_routing}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truck_routing}
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            # 5433 on the host to avoid clashing with a local Postgres
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build: ./backend
        restart: unless-stopped
        # Optional, e.g. DJANGO_SECRET_KEY or other provider URLs
        env_file:
            - path: ./backend/.env
              required: false
        # These override backend/.env so the container always talks to the db service
        environment:
            DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
            DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
            CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173
            POSTGRES_DB: ${POSTGRES_DB:-truck_routing}
            POSTGRES_USER: ${POSTGRES_USER:-truck_routing}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truck_routing}
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
        depends_on:
            db:
                condition: service_healthy
        ports:
            - '8000:8000'

    frontend:
        build: ./frontend
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - '8080:80'

volumes:
    pgdata:
